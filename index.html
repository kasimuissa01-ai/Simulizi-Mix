<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SimuliziMix - Storytelling & Audiobooks Offline</title>

    <!-- PWA & Mobile Display Meta -->
    <meta name="theme-color" content="#F7F4F0" />
    <meta name="description" content="Sikiliza masimulizi na audiobooks bora za Kiswahili bila mtandao (Offline Audio Storytelling)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SimuliziMix" />

    <!-- Links & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://vqgnxqabvmmpfoiceass.supabase.co/storage/v1/object/public/app-assets/icon-192.png" />
    <link rel="apple-touch-icon" href="https://vqgnxqabvmmpfoiceass.supabase.co/storage/v1/object/public/app-assets/apple-touch-icon.png" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "247aaeb9-b473-48cc-9e3f-9d4d0c0d3449",
            safari_web_id: "web.onesignal.auto.1d9d9717-02c9-46fa-a0ca-aedc9bb61733",
            allowLocalhostAsSecureOrigin: true,
            notifyButton: {
              enable: true,
            },
            slidedown: {
              prompts: [
                {
                  type: "push",
                  autoPrompt: true,
                  text: {
                    actionMessage: "Unapenda kupokea taarifa za masimulizi na hadithi mpya?",
                    acceptButton: "Ruhusu",
                    cancelButton: "Baadae",
                  },
                }
              ]
            }
          });
        } catch (err) {
          console.warn('[OneSignal] Initialization notice (Active on https://simulizimix.vercel.app):', err ? (err.message || err) : err);
        }
      });
    </script>

    <script>
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        console.log('[PWA] beforeinstallprompt event fired:', e);
        if (window.onPwaPromptReady) {
          window.onPwaPromptReady(e);
        }
      });
    </script>
  </head>
  <body className="bg-[#F7F4F0] text-black antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
